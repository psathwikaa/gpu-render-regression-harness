[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-render-regression-harness"
version = "1.0.0"
description = "Off-screen OpenGL GPU Render Regression Test Harness with SSIM comparison, frame-time stability profiling, structured JSONL logging, and HTML reporting for GitLab CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Graphics & QA Engineering" }
]
dependencies = [
    "moderngl>=5.8.0",
    "PyOpenGL>=3.1.7",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
gpu-harness = "gpu_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
